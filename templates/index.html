<h1>BookStore Management System</h1>

{% if current_user.is_authenticated %}
    <p>Logged in as {{ current_user.email }}</p>

    <!-- Orders & Customers Section -->
    <h2>Orders</h2>
    <ul>
        <li><a href="/customers">Manage Customers</a></li>
        <li><a href="/orders">Manage Orders</a></li>
        <li><a href="/chart">View Sales Chart</a></li>
    </ul>

    <!-- Inventory Section -->
    <h2>Inventory</h2>
    <ul>
        <li><a href="/authors">Manage Authors</a></li>
        <li><a href="/books">Manage Books</a></li>
    </ul>

    <br>
    <a href="/logout">Logout</a><br>

{% else %}
    <a href="/login">Login</a><br>
    <a href="/register">Register</a><br>
{% endif %}
